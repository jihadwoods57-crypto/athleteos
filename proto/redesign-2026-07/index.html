<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- maximum-scale + user-scalable=no: this is an app, not a web page. Without them WKWebView
       lets you pinch-zoom and double-tap-zoom the whole UI, which instantly reads as "a website
       in a wrapper" — no native app behaves that way. Mobile Safari ignores user-scalable=no for
       accessibility, but an in-app WKWebView honours it. -->
  <!-- interactive-widget=resizes-content is the Android half of js/keyboard.js: it shrinks the
       LAYOUT viewport when the keyboard opens, so 100dvh keeps meaning "the part of the app you
       can see" and the shell needs no measuring there. iOS ignores it (WKWebView draws the keys
       over the layout viewport instead), which is what the visualViewport math is for. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>OnStandard — Athlete App Redesign</title>
  <!-- Without a declared icon the browser fires GET /favicon.ico on every load — a guaranteed 404
       in the console noise, and the first "error" anyone profiling the app has to rule out. The
       WebView never shows an icon, so an empty data: URI is the honest answer, not an asset. -->
  <link rel="icon" href="data:," />

  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/screens.css" />
  <link rel="stylesheet" href="./css/flows.css" />
  <link rel="stylesheet" href="./css/coach.css" />
  <link rel="stylesheet" href="./css/ob2.css" />
  <!-- The navigation transition layer. Every selector inside is a ::view-transition pseudo, so a
       browser without the API matches nothing and keeps today's rendering exactly. -->
  <link rel="stylesheet" href="./css/view-transition.css" />
  <!-- Liquid Glass chrome + the layers the navigation gestures move. After app.css so it wins the
       tab bar's equal-specificity ties; before focus.css, which must stay last. -->
  <link rel="stylesheet" href="./css/glass.css" />
  <!-- Last on purpose: the focus layer must win over the 9 rules that set `outline: none`. -->
  <link rel="stylesheet" href="./css/focus.css" />
</head>
<body>
  <div class="device" id="device"></div>
  <!-- Supabase config. The native shell injects window.__SUPABASE (document-start) before this
       runs; the fallback lets the proto work at :8124. The anon key is public (RLS is the real
       authorization), the same value the app already ships as EXPO_PUBLIC_SUPABASE_ANON_KEY. -->
  <script>
    window.__SUPABASE = window.__SUPABASE || {
      url: 'https://ftwrvylzoyznhbzhgism.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0d3J2eWx6b3l6bmhiemhnaXNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODYyNDYsImV4cCI6MjA5Nzg2MjI0Nn0.mJBl-Esn2YRB_jaUv_SQXT8wGfbx06dx7Ss9xyGRoH0'
    };
  </script>
  <!-- defer: ~200KB of synchronous parse used to sit between HTML parse and DOMContentLoaded,
       delaying the boot skeleton. Everything that touches window.supabase (js/supabase.js, and
       router.js behind it) is a module, and modules are deferred by spec — so ordering holds:
       deferred scripts run in document order before DOMContentLoaded. -->
  <script src="./js/vendor/supabase.js" defer></script>
  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/router.js"></script>
</body>
</html>
