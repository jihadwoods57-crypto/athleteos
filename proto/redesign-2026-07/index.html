<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- maximum-scale + user-scalable=no: this is an app, not a web page. Without them WKWebView
       lets you pinch-zoom and double-tap-zoom the whole UI, which instantly reads as "a website
       in a wrapper" — no native app behaves that way. Mobile Safari ignores user-scalable=no for
       accessibility, but an in-app WKWebView honours it. -->
  <!-- interactive-widget=resizes-content is the Android half of js/keyboard.js: it shrinks the
       LAYOUT viewport when the keyboard opens, so 100dvh keeps meaning "the part of the app you
       can see" and the shell needs no measuring there. iOS ignores it (WKWebView draws the keys
       over the layout viewport instead), which is what the visualViewport math is for. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>OnStandard — Athlete App Redesign</title>
  <!-- Without a declared icon the browser fires GET /favicon.ico on every load — a guaranteed 404
       in the console noise, and the first "error" anyone profiling the app has to rule out. The
       WebView never shows an icon, so an empty data: URI is the honest answer, not an asset. -->
  <link rel="icon" href="data:," />

  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/screens.css" />
  <link rel="stylesheet" href="./css/flows.css" />
  <!-- OFF THE CRITICAL PATH, WITHOUT MOVING IN THE CASCADE (2026-09-07).
       These two are 80 KB of the 475 KB of CSS that used to block first paint, and an athlete
       opens neither: coach.css is the operator surface, ob2.css runs once ever, at onboarding.
       `media="print"` is the whole trick. The browser still fetches the sheet, but a non-matching
       media query makes it NON-RENDER-BLOCKING — and because cascade order is decided by position
       in the document rather than by load time, flipping media to "all" later applies every rule
       exactly where it always applied. Deferring these with a moved <link> or an injected one
       would land them AFTER focus.css, whose own comment two lines down is that it must stay last
       to beat the nine `outline: none` rules. That would have traded a slow paint for a broken
       focus ring.
       The flip is immediate when the boot route actually needs them (a coach opening the app must
       not see a frame of unstyled roster), and otherwise waits for the first paint. -->
  <link rel="stylesheet" href="./css/coach.css" media="print" data-defer-css />
  <link rel="stylesheet" href="./css/ob2.css" media="print" data-defer-css />
  <script>
    (function () {
      var flip = function () {
        var sheets = document.querySelectorAll('link[data-defer-css]');
        for (var i = 0; i < sheets.length; i++) sheets[i].media = 'all';
      };
      // A coach or an athlete mid-onboarding lands directly on a screen these sheets style.
      // Cheap prefix test on the boot hash; anything else can wait two frames.
      var h = (location.hash || '').toLowerCase();
      if (/coach|trainer|dietitian|ob2|onboard/.test(h)) { flip(); return; }
      // Two frames: the first paints, the second is safely after it.
      requestAnimationFrame(function () { requestAnimationFrame(flip); });
    })();
  </script>
  <!-- The navigation transition layer. Every selector inside is a ::view-transition pseudo, so a
       browser without the API matches nothing and keeps today's rendering exactly. -->
  <link rel="stylesheet" href="./css/view-transition.css" />
  <!-- Liquid Glass chrome + the layers the navigation gestures move. After app.css so it wins the
       tab bar's equal-specificity ties; before focus.css, which must stay last. -->
  <link rel="stylesheet" href="./css/glass.css" />
  <!-- Last on purpose: the focus layer must win over the 9 rules that set `outline: none`. -->
  <link rel="stylesheet" href="./css/focus.css" />
</head>
<body>
  <!-- The boot skeleton, inline, so the first frame paints from HTML + CSS alone. Until 2026-09-05
       this div was empty until every module had evaluated: on a slow phone that was a blank
       canvas for the whole parse. Same shape router.js bootShell() paints (it is idempotent over
       this and only adds the role's tab bar); render() replaces the whole subtree once a screen
       is ready, and the auth gate is untouched, so a signed-out user still lands on Welcome. -->
  <div class="device" id="device">
    <div class="island"></div>
    <div class="screen booting">
      <div class="statusbar" aria-hidden="true"></div>
      <div class="viewport" id="viewport">
        <main class="view" id="view" aria-busy="true" aria-label="Loading your day">
          <div class="sk-hero"><div class="sk-ring"></div><div class="sk-line sk-hero-l"></div></div>
          <section class="card sk-card" aria-busy="true" aria-label="Loading your day"><div class="sk-row"><div class="sk-dot"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sk-line-2"></div></div></div><div class="sk-row"><div class="sk-dot"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sk-line-2"></div></div></div><div class="sk-row"><div class="sk-dot"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sk-line-2"></div></div></div></section>
          <section class="card sk-card" aria-busy="true" aria-label=""><div class="sk-row"><div class="sk-dot"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sk-line-2"></div></div></div><div class="sk-row"><div class="sk-dot"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sk-line-2"></div></div></div></section>
        </main>
      </div>
    </div>
  </div>
  <!-- Supabase config. The native shell injects window.__SUPABASE (document-start) before this
       runs; the fallback lets the proto work at :8124. The anon key is public (RLS is the real
       authorization), the same value the app already ships as EXPO_PUBLIC_SUPABASE_ANON_KEY. -->
  <script>
    window.__SUPABASE = window.__SUPABASE || {
      url: 'https://ftwrvylzoyznhbzhgism.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0d3J2eWx6b3l6bmhiemhnaXNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODYyNDYsImV4cCI6MjA5Nzg2MjI0Nn0.mJBl-Esn2YRB_jaUv_SQXT8wGfbx06dx7Ss9xyGRoH0'
    };
  </script>
  <!-- defer: ~200KB of synchronous parse used to sit between HTML parse and DOMContentLoaded,
       delaying the boot skeleton. Everything that touches window.supabase (js/supabase.js, and
       router.js behind it) is a module, and modules are deferred by spec — so ordering holds:
       deferred scripts run in document order before DOMContentLoaded. -->
  <script src="./js/vendor/supabase.js" defer></script>
  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/router.js"></script>
</body>
</html>
